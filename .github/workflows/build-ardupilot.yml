name: Build ArduPilot for CubeOrangePlus

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ArduPilot build dependencies
        run: Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Build ArduCopter
        run: |
          source "$HOME/.profile"
          export PATH="/usr/lib/ccache:$PATH"
          command -v arm-none-eabi-ar
          ./waf configure --board CubeOrangePlus
          ./waf copter

      - name: Upload flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: arducopter-CubeOrangePlus
          path: build/CubeOrangePlus/bin/arducopter.apj
          if-no-files-found: error
